name: Release

on:
  workflow_dispatch:
    inputs:
      increment:
        description: Version increment
        type: choice
        options: [patch, minor, major]
        required: true

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/CI.yml

  release:
    needs: checks
    permissions:
      contents: write
    uses: minimalstuff/tooling/.github/workflows/release.yml@705224c97824f55bc28a6139ea0aacefe4da82e1 # v0.9.0
    with:
      increment: ${{ inputs.increment }}
      node-version-file: mise.toml
    secrets:
      release-deploy-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
