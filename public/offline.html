<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Hors ligne — Dictée vocale</title>
		<style>
			:root {
				color-scheme: light dark;
				--color-canvas: #f3f6f8;
				--color-ink: #14202a;
				--color-muted: #5a6873;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--color-canvas: #131b21;
					--color-ink: #e6edf2;
					--color-muted: #8d9aa5;
				}
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				padding: 1rem;
				box-sizing: border-box;
				font-family: system-ui, sans-serif;
				text-align: center;
				background: var(--color-canvas);
				color: var(--color-ink);
			}
			p {
				color: var(--color-muted);
			}
		</style>
	</head>
	<body>
		<main>
			<h1>Hors ligne</h1>
			<p>
				La dictée a besoin du serveur. Vérifiez votre connexion puis rechargez
				la page.
			</p>
		</main>
	</body>
</html>
